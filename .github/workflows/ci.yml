# UniNet CI on GitHub's runners.
#
# This exists for one reason: Linux is easy to test anywhere, and macOS and
# Windows are not. GitHub provides both as real machines, so every push gets
# built and tested natively on all three, including discovery over an actual
# network stack rather than an emulated one.
#
# The GitLab pipeline (.gitlab-ci.yml) covers the same ground plus the
# sanitizers, but its Windows and macOS jobs need runners the project may not
# have. These jobs need nothing provisioned.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config zlib1g-dev liblz4-dev \
            python3-dev python3-pip pybind11-dev libzmq3-dev libczmq-dev
      # Ubuntu packages libzmq and czmq but not zyre, which is exactly the
      # situation CMake's per-dependency fallback exists for: leave zyre to it.
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUNINET_WERROR=ON \
                -DUNINET_BUILD_CABI=ON -DUNINET_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      # --no-tests=error: without it a label matching nothing exits 0, and a
      # suite that silently stopped running reads as a suite that passed.
      - name: Test
        run: ctest --test-dir build -L uninet --no-tests=error --output-on-failure
      - name: Python
        run: PYTHONPATH=$PWD/python python3 -m pytest python/tests -q
      # A separate artifact from the in-tree build, and the only step that would
      # catch a wheel shipped without its compiled extension. Imported from /tmp
      # so the source tree cannot shadow the installed package.
      - name: pip wheel
        run: |
          python3 -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q .
          cd /tmp && /tmp/wheelenv/bin/python -c "
          import uninet; from uninet import _uninet
          assert 'site-packages' in uninet.__file__, uninet.__file__
          print('wheel OK:', uninet.__version__)"
      - name: Cross-language interop
        run: ./scripts/test-interop.sh

  macos:
    runs-on: macos-14          # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config zeromq czmq zyre lz4 pybind11
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUNINET_WERROR=ON \
                -DUNINET_BUILD_CABI=ON -DUNINET_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build -L uninet --no-tests=error --output-on-failure
      - name: Python
        run: PYTHONPATH=$PWD/python python3 -m pytest python/tests -q
      - name: Cross-language interop
        run: ./scripts/test-interop.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install zeromq:x64-windows czmq:x64-windows zyre:x64-windows zlib:x64-windows
      # Static CRT/lib linkage is off here: the vcpkg triplet is the DLL one, so
      # UNINET_ZMQ_STATIC must stay off or the link picks up mismatched symbols.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
                -DUNINET_BUILD_CABI=ON `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j
      # This is the job that matters most: it is the only place discovery and
      # messaging are exercised on a real Windows network stack. The Wine-based
      # container in tests/docker/ cannot reach it, because Wine does not
      # implement GetAdaptersAddresses' buffer-sizing protocol and czmq's
      # ziflist asserts on it.
      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release -L uninet --no-tests=error --output-on-failure
