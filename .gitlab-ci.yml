# UniNet CI.
#
# The point of this file is that "works on my machine" is not a claim anyone has
# to take on trust. Every push builds and tests on Linux, Windows and macOS, and
# runs the three languages against each other.
#
# Jobs that need a runner tag the project may not have (windows, macos) are
# marked `allow_failure` so a missing runner reports as a warning rather than
# blocking the pipeline, but when the runner exists, a genuine failure is still
# visible. Remove `allow_failure` once the runners are provisioned.

stages: [build, test, interop]

variables:
  GIT_DEPTH: "50"

# ── Linux ─────────────────────────────────────────────────────────────────
# The container image carries the toolchain, Zyre built from source, Python and
# the .NET SDK (see tests/docker/Dockerfile.linux).
.linux-base:
  image: debian:bookworm
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        build-essential cmake pkg-config git ca-certificates
        zlib1g-dev liblz4-dev libsodium-dev
        python3 python3-dev python3-pip pybind11-dev
    # Debian does not package Zyre; build the same versions CMake would fetch.
    - git clone --depth 1 -b v4.3.5 https://github.com/zeromq/libzmq.git /tmp/libzmq
    - cmake -S /tmp/libzmq -B /tmp/libzmq/b -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
        -DWITH_PERF_TOOL=OFF -DWITH_DOC=OFF && cmake --build /tmp/libzmq/b -j"$(nproc)"
        && cmake --install /tmp/libzmq/b
    - git clone --depth 1 -b v4.2.1 https://github.com/zeromq/czmq.git /tmp/czmq
    - cmake -S /tmp/czmq -B /tmp/czmq/b -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        && cmake --build /tmp/czmq/b -j"$(nproc)" && cmake --install /tmp/czmq/b
    - git clone --depth 1 -b v2.0.1 https://github.com/zeromq/zyre.git /tmp/zyre
    - cmake -S /tmp/zyre -B /tmp/zyre/b -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        && cmake --build /tmp/zyre/b -j"$(nproc)" && cmake --install /tmp/zyre/b
    - ldconfig

linux:build-and-test:
  extends: .linux-base
  stage: test
  script:
    # -Werror in CI only: a warning that reaches main is a warning nobody fixes.
    # It has to be a configure-time option; passing CXXFLAGS to the build tool
    # set a variable CMake's recipes do not read, so it did nothing for months.
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUNINET_WERROR=ON
        -DUNINET_BUILD_CABI=ON -DUNINET_BUILD_PYTHON=ON
    - cmake --build build -j"$(nproc)" 
    # --no-tests=error: a label that matches nothing otherwise exits 0.
    - ctest --test-dir build -L uninet --no-tests=error --output-on-failure
    - PYTHONPATH=$PWD/python python3 -m pytest python/tests -q
  artifacts:
    when: on_failure
    paths: [build/Testing/]
    expire_in: 1 week

linux:sanitizers:
  extends: .linux-base
  stage: test
  script:
    # The network path is threaded; TSan is the only thing that reliably catches
    # a regression there. ASan/UBSan cover the codec's hostile-input handling.
    # UNINET_SYSTEM_ZYRE=OFF matters: against an uninstrumented system libzmq,
    # TSan reported 47 races, all but one of them synchronisation it could not
    # see into. With the dependencies built under TSan the same run reports 0.
    - cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DUNINET_SYSTEM_ZYRE=OFF
        -DCMAKE_C_FLAGS="-fsanitize=thread -g -O1"
        -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
    - cmake --build build-tsan -j"$(nproc)" --target test_network
    # setarch -R: TSan aborts under ASLR often enough to make the job flaky.
    - setarch -R ./build-tsan/test_network 2>&1 | tee tsan.log
    - "! grep -q 'WARNING: ThreadSanitizer' tsan.log" 
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DUNINET_BUILD_CABI=ON
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build build-asan -j"$(nproc)"
    - ASAN_OPTIONS=detect_leaks=1 ./build-asan/test_roundtrip
    - ASAN_OPTIONS=detect_leaks=0 ./build-asan/test_network
  allow_failure: false

# ── Windows portability, without a Windows runner ─────────────────────────
# Compiles every translation unit for x86_64-w64-mingw32. This is what catches
# POSIX-only calls and Windows header collisions (`interface` is a macro there)
# even when no Windows runner is available.
windows:portability-check:
  stage: build
  image: debian:bookworm
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        mingw-w64 mingw-w64-tools git ca-certificates libz-mingw-w64-dev
    - git clone --depth 1 -b v4.3.5 https://github.com/zeromq/libzmq.git /hdr/libzmq
    - git clone --depth 1 -b v4.2.1 https://github.com/zeromq/czmq.git /hdr/czmq
    - git clone --depth 1 -b v2.0.1 https://github.com/zeromq/zyre.git /hdr/zyre
  script:
    - INC="-Iinclude -I/hdr/zyre/include -I/hdr/czmq/include -I/hdr/libzmq/include"
    - for f in src/*.cpp; do
        echo "== $f";
        x86_64-w64-mingw32-g++-posix -std=c++17 -Wall -Wextra -Werror -c -O1
          -D_WIN32_WINNT=0x0601 -DUNINET_HAS_ZLIB=1 $INC "$f" -o /tmp/o.obj || exit 1;
      done
    - x86_64-w64-mingw32-gcc-posix -std=c99 -Wall -Wextra -Werror -c -O1
        -D_WIN32_WINNT=0x0601 $INC tests/test_cabi.c -o /tmp/c.obj

# Runs the cross-compiled .exe files under Wine. Covers the codec, the JSON
# bridge and the C ABI as real Windows code. Discovery is NOT covered: Wine does
# not implement GetAdaptersAddresses' buffer-sizing protocol, which czmq asserts
# on, only the msvc job below can close that gap.
windows:wine-runtime:
  stage: test
  image: docker:latest
  services: [docker:dind]
  # docker:dind enables TLS by default; without these the client cannot reach
  # the daemon at all. It also needs a privileged runner, which is why this is
  # allow_failure until one exists, like the other runner-dependent jobs.
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  allow_failure: true
  script:
    - docker build --network host -f tests/docker/Dockerfile.windows-run -t uninet-winrun .
    - docker run --rm --network host -v "$PWD":/src:ro uninet-winrun

# ── Real Windows, with MSVC ───────────────────────────────────────────────
# Needs a runner tagged `windows`. vcpkg supplies zlib/lz4/zeromq/czmq/zyre.
windows:msvc:
  stage: test
  tags: [windows]
  allow_failure: true          # remove once a Windows runner exists
  script:
    - git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
    - C:\vcpkg\bootstrap-vcpkg.bat
    - C:\vcpkg\vcpkg.exe install zlib:x64-windows lz4:x64-windows zeromq:x64-windows czmq:x64-windows zyre:x64-windows
    - cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        -DUNINET_BUILD_CABI=ON
    - cmake --build build --config Release
    - ctest --test-dir build -C Release -L uninet --no-tests=error --output-on-failure

# ── macOS ─────────────────────────────────────────────────────────────────
# Needs a runner tagged `macos`.
macos:
  stage: test
  tags: [macos]
  allow_failure: true          # remove once a macOS runner exists
  script:
    - brew install cmake pkg-config zlib lz4 zyre || true
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUNINET_BUILD_CABI=ON
    - cmake --build build -j"$(sysctl -n hw.ncpu)"
    - ctest --test-dir build -L uninet --no-tests=error --output-on-failure

# ── Cross-language interop ────────────────────────────────────────────────
# C++, Python and C# nodes in one realm, each verifying the others' payloads.
# This is the job that would catch a binding drifting from the wire format.
interop:three-languages:
  extends: .linux-base
  stage: interop
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        -DUNINET_BUILD_CABI=ON -DUNINET_BUILD_PYTHON=ON
    - cmake --build build -j"$(nproc)"
    - ./scripts/test-interop.sh 30
